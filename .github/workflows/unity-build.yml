name: unity-build

on:
  workflow_dispatch:
      inputs:
        use_self_hosted:
          required: true
          default: false
          type: boolean

jobs:
  build:
    name: Unity Build
    runs-on: ${{ format('{0}', github.event.inputs.use_self_hosted) == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          # Semantic versioning invokes `sh`, which is not available on a
          # default Windows runner PATH. This build does not require Git-based
          # automatic versioning, so keep the workflow shell-independent.
          versioning: None

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: Build
          path: build
